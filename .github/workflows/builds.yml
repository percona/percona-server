# PS-11078: GitHub Actions build for percona-server trunk on Hetzner cax* arm64,
# plus a nightly x86_64 gcc-16 build on Hetzner cpx62 (PS-11298).
# Replaces the Cirrus arm64 tasks before Cirrus shuts down 2026-06-01.
#
# PS-11179 (2026-05-28): AWS Graviton fallback path added. Hetzner remains the
# primary provider; if the cax41/cax31/cax21 sweep across fsn1/hel1/nbg1 fails
# repeatedly, pick-target switches provider to "aws" and create-runner-aws
# provisions a c7g.4xlarge Graviton3 spot (with on-demand fallback) in
# eu-central-1. Build steps are unchanged; only the runner provisioning path
# branches.
#
# One file, three event paths (BUILD_TYPE + MTR_SUITE picked by `dispatch` job):
#   - pull_request to trunk        -> Debug + MTR main.1st     (same-repo PRs; Cirrus per-PR replacement)
#   - pull_request_target to trunk -> Debug + MTR main.1st     (PS-11254: fork PRs by percona org members only)
#   - workflow_dispatch          -> manual run OR nightly (build_type RelWithDebInfo -> binlog_nogtid)
#
# Nightly RelWithDebInfo + binlog_nogtid is NOT a `schedule:` trigger here:
# GHA cron only fires from the DEFAULT branch, so a cron in this file would be
# dead on trunk (a non-default branch). Instead .github/workflows/
# builds-nightly.yml lives on the default branch and dispatches THIS file via
# workflow_dispatch --ref on each maintained branch, so each nightly runs that
# branch's own self-contained builds.yml (its boost version, cmake/apt deltas).
#
# PS-11298: the provisioning + build chain lives in build-chain.yml
# (workflow_call) and is called once per arch below: `arm64` on every event,
# `amd64` (gcc-16 on Hetzner cpx62, EC2 c7i.4xlarge fallback) on the
# RelWithDebInfo nightly only. This file keeps the triggers, the
# authorization gate and the per-event build_type / MTR suite pick.
#
# Notes for follow-ups (per Przemek DM 2026-05-27):
#
# Trust split: the chain's pick-target / create-runner-* / delete-runner-*
# hold infra secrets (GHA_RUNNER_HCLOUD_TOKEN, GHA_RUNNER_PAT, AWS_ROLE_ARN
# via OIDC). The chain's build job runs on the ephemeral runner (Hetzner OR
# EC2) and only sees GITHUB_TOKEN (read-only), so PR code never reaches infra
# credentials.
#
# PS-11254: fork PRs run via pull_request_target so the provisioning jobs
# resolve secrets in base-repo context. This is safe ONLY because the
# secret-bearing jobs do NO checkout; the chain's build job is the sole job
# that checks out PR code, and it holds no secrets. The `authorize` gate limits
# pull_request_target to fork PRs whose author has admin/maintain/write repo
# permission, checked through the collaborators API with GHA_RUNNER_PAT (not
# author_association, see the authorize job). INVARIANT: never add a PR-code
# checkout to a secret-bearing job.

name: builds

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - Debug
          - RelWithDebInfo
        default: Debug
      debug_keep_vm:
        description: 'On create-runner failure: keep Hetzner VM alive so you can SSH in and grab /var/log/cloud-init-output.log + /actions-runner/_diag/* manually. SSH as root using key 107239874 (anderson@percona). Remember to delete the VM when done. (Hetzner path only; EC2 fallback always terminates.)'
        type: boolean
        default: false
      force_provider:
        description: 'Override provider selection (debug + cost benchmarking). "auto" = Hetzner with EC2 fallback (default, production behavior). "hetzner" = Hetzner only, fail if exhausted (no AWS spend). "aws" = skip Hetzner, go straight to EC2 (validate AWS path on demand without waiting for a real Hetzner outage).'
        type: choice
        options:
          - auto
          - hetzner
          - aws
        default: auto
  pull_request:
    branches: [trunk]
    paths-ignore:
      # Mirrors azure-pipelines.yml `paths.exclude`.
      - 'doc/**'
      - 'build-ps/**'
      - 'man/**'
      - 'mysql-test/**'
      - 'packaging/**'
      - 'policy/**'
      - 'scripts/**'
      - 'support-files/**'
  pull_request_target:
    # PS-11254: fork PRs get no secrets on `pull_request` (GitHub withholds
    # them from forks), so org-member fork PRs run here in base-repo context,
    # gated by `dispatch` below. Same-repo PRs stay on `pull_request`.
    branches: [trunk]
    paths-ignore:
      - 'doc/**'
      - 'build-ps/**'
      - 'man/**'
      - 'mysql-test/**'
      - 'packaging/**'
      - 'policy/**'
      - 'scripts/**'
      - 'support-files/**'

concurrency:
  # PR runs (pull_request + pull_request_target) are cancellable so superseded
  # pushes do not waste Hetzner cycles; workflow_dispatch runs (including the
  # nightly dispatched from the default branch) stay protected
  # (cancel-in-progress: false) because they bill paid Hetzner and EC2 minutes.
  # event_name is in the key so a fork PR's (skipped) pull_request run and its
  # real pull_request_target run do not share a group.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Workflow-level permissions are minimal (contents: read) to limit blast
# radius for any future jobs added here. The id-token: write grant required
# for OIDC -> AWS STS federation is the ceiling on the `arm64` / `amd64`
# caller jobs, and inside build-chain.yml only create-runner-aws and
# delete-runner-aws take it. The chain's build job runs untrusted PR code on
# the ephemeral runner and intentionally does not get id-token.
permissions:
  contents: read

jobs:
  # TRUSTED authorization gate (PS-11254). Root of the job graph: dispatch
  # needs it and every other job chains off dispatch, so gating here gates the
  # whole run.
  #   - schedule / workflow_dispatch: always
  #   - pull_request: same-repo PRs only (forks get no secrets on this event)
  #   - pull_request_target: fork PRs only, authorized when the PR author has
  #     write+ access to the repo. author_association is deliberately NOT used:
  #     its value in the event payload is CONTRIBUTOR for PRIVATE percona org
  #     members, so it would wrongly reject them. The repo-permission API call
  #     via GHA_RUNNER_PAT is reliable (empirically confirmed: members resolve
  #     to write, non-collaborators to read on this public repo). This job does
  #     no checkout and runs in base-repo context, so the trust split holds.
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - id: gate
        env:
          GH_TOKEN:  ${{ secrets.GHA_RUNNER_PAT }}
          EVENT:     ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR:    ${{ github.event.pull_request.user.login }}
        run: |
          set -u
          # PS-11078: forks without GHA_RUNNER_PAT would otherwise sail through
          # this gate (schedule/workflow_dispatch always authorize; a same-repo
          # pull_request -- including one opened inside a fork -- authorizes
          # too) and only fail downstream, in pick-target / create-runner-*,
          # once those jobs discover they have no infra secrets either.
          # Two cases are left to the existing logic below instead of this
          # early check: pull_request_target needs GH_TOKEN for the
          # collaborator-permission lookup (an empty token there already
          # resolves to ok=false), and a fork PR into this repo via plain
          # pull_request already gets ok=false from HEAD_REPO != BASE_REPO --
          # folding it in here would print a misleading "skipping (fork?)"
          # notice on every such PR even though the outcome is unchanged.
          # On percona/percona-server itself a missing PAT fails loudly
          # instead of silently skipping, same as builds-nightly.yml.
          if [ -z "$GH_TOKEN" ] && [ "$EVENT" != "pull_request_target" ] \
             && ! { [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; }; then
            if [ "$BASE_REPO" = "percona/percona-server" ]; then
              echo "::error::GHA_RUNNER_PAT is not set on $BASE_REPO"
              exit 1
            fi
            echo "::notice::GHA_RUNNER_PAT is not set on $BASE_REPO; skipping (fork)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=false
          case "$EVENT" in
            schedule|workflow_dispatch)
              ok=true ;;
            pull_request)
              [ "$HEAD_REPO" = "$BASE_REPO" ] && ok=true ;;
            pull_request_target)
              if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
                perm=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$BASE_REPO/collaborators/$AUTHOR/permission" \
                  | jq -r '.permission // "none"' 2>/dev/null || echo none)
                case "$perm" in admin|maintain|write) ok=true ;; esac
                echo "::notice::fork PR by $AUTHOR; repo permission=$perm -> authorized=$ok"
              fi ;;
          esac
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  # TRUSTED. Pick BUILD_TYPE + MTR suite + cache size based on event.
  dispatch:
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build_type:     ${{ steps.pick.outputs.build_type }}
      mtr_suite:      ${{ steps.pick.outputs.mtr_suite }}
      ccache_maxsize: ${{ steps.pick.outputs.ccache_maxsize }}
    steps:
      - id: pick
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request|pull_request_target)
              BT=Debug;          SUITE=main.1st;      CACHE=4G
              ;;
            workflow_dispatch)
              # Manual runs AND the nightly dispatcher (builds-nightly.yml on
              # the default branch) land here. build_type=RelWithDebInfo ->
              # binlog_nogtid (Cirrus nightly parity, Przemek 2026-05-18);
              # build_type=Debug -> main.1st.
              BT="${{ inputs.build_type }}"
              if [ "$BT" = "Debug" ]; then
                SUITE=main.1st;      CACHE=4G
              else
                SUITE=binlog_nogtid; CACHE=8G
              fi
              ;;
          esac
          echo "Event ${{ github.event_name }} -> BUILD_TYPE=$BT, MTR=$SUITE, CCACHE_MAXSIZE=$CACHE" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "build_type=$BT"
            echo "mtr_suite=$SUITE"
            echo "ccache_maxsize=$CACHE"
          } >> "$GITHUB_OUTPUT"

  # PS-11298: both arch chains live in build-chain.yml (one copy, reviewed in
  # one place). The caller job grants the permission ceiling (id-token: write
  # for the two AWS jobs inside); every job in the chain narrows it again.
  # Secrets are passed by name, never `secrets: inherit`.

  # arm64 on every event: per-PR Debug + main.1st, nightly RelWithDebInfo.
  arm64:
    needs: dispatch
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-chain.yml
    with:
      arch: arm64
      # cax41 preferred; cax31/cax21 when it is out of stock (PS-11174).
      hetzner_server_types: cax41 cax31 cax21
      aws_instance_type: c7g.4xlarge
      build_type:     ${{ needs.dispatch.outputs.build_type }}
      mtr_suite:      ${{ needs.dispatch.outputs.mtr_suite }}
      ccache_maxsize: ${{ needs.dispatch.outputs.ccache_maxsize }}
      force_provider: ${{ github.event_name == 'workflow_dispatch' && inputs.force_provider || 'auto' }}
      debug_keep_vm:  ${{ inputs.debug_keep_vm == true }}
    secrets:
      GHA_RUNNER_HCLOUD_TOKEN: ${{ secrets.GHA_RUNNER_HCLOUD_TOKEN }}
      GHA_RUNNER_PAT:          ${{ secrets.GHA_RUNNER_PAT }}
      AWS_ROLE_ARN:            ${{ secrets.AWS_ROLE_ARN }}

  # amd64 gcc-16 on the RelWithDebInfo dispatch path only (the nightly), never
  # on per-PR Debug builds. Adds gcc-16 on Ubuntu 26.04 plus x86_64 MTR. Azure
  # Pipelines builds gcc-16 only on 24.04 and runs no MTR on x86_64.
  amd64:
    needs: dispatch
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'RelWithDebInfo'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-chain.yml
    with:
      arch: amd64
      hetzner_server_types: cpx62
      aws_instance_type: c7i.4xlarge
      compiler_ver: '16'
      ccache_key_suffix: '-16-amd64'
      build_type:     ${{ needs.dispatch.outputs.build_type }}
      mtr_suite:      ${{ needs.dispatch.outputs.mtr_suite }}
      ccache_maxsize: ${{ needs.dispatch.outputs.ccache_maxsize }}
      force_provider: ${{ github.event_name == 'workflow_dispatch' && inputs.force_provider || 'auto' }}
      debug_keep_vm:  ${{ inputs.debug_keep_vm == true }}
    secrets:
      GHA_RUNNER_HCLOUD_TOKEN: ${{ secrets.GHA_RUNNER_HCLOUD_TOKEN }}
      GHA_RUNNER_PAT:          ${{ secrets.GHA_RUNNER_PAT }}
      AWS_ROLE_ARN:            ${{ secrets.AWS_ROLE_ARN }}
