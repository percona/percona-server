schedules:
- cron: "0 1 * * *"
  displayName: Daily 1:00 AM UTC build
  branches:
    include:
    - 8.4

trigger: none

pr:
  drafts: false
  branches:
    include:
    - '*'
  paths:
    exclude:
    - doc
    - build-ps
    - man
    - mysql-test
    - packaging
    - policy
    - scripts
    - support-files

jobs:
- job: BiDiScan
  pool:
    vmImage: 'ubuntu-22.04'

  steps:
  # TEMPORARY (PS-11473): settles two open questions about the full-CI guard in
  # the build job below. Delete once answered.
  #
  # Each line prints a variable's compile-time value -- ${{ }}, baked into the
  # script text when the run is created -- next to its runtime value, $(),
  # expanded on the agent. A compile-time value that is empty while its runtime
  # value is not means that variable is not populated at template-expansion time
  # and therefore cannot drive a ${{ if }} guard.
  #
  # Run on a branch whose name contains "fullci", then compare with the leg
  # count. If "guard" prints True but only the five default configs were built,
  # the condition is fine and the grouped conditional insertion is what failed.
  - script: |
      echo "Build.Reason                    compile='${{ variables['Build.Reason'] }}'  runtime='$(Build.Reason)'"
      echo "Build.SourceBranch              compile='${{ variables['Build.SourceBranch'] }}'  runtime='$(Build.SourceBranch)'"
      echo "Build.SourceBranchName          compile='${{ variables['Build.SourceBranchName'] }}'  runtime='$(Build.SourceBranchName)'"
      echo "System.PullRequest.SourceBranch compile='${{ variables['System.PullRequest.SourceBranch'] }}'  runtime='$(System.PullRequest.SourceBranch)'"
      echo "guard                           compile='${{ or(ne(variables['Build.Reason'], 'PullRequest'), contains(variables['System.PullRequest.SourceBranch'], 'fullci'), contains(variables['Build.SourceBranch'], 'fullci')) }}'"
    displayName: '*** PS-11473 variable probe'

  - checkout: self
    fetchDepth: 32

  - script: |
      git fetch origin 8.4
      CHANGED_FILES=$(git diff --name-only --relative --diff-filter AMR origin/8.4 -- . | tr '\n' ' ')

      if [ -z "${CHANGED_FILES}" ]; then
          echo --- No changed files
      else
          python $(Build.SourcesDirectory)/scripts/find_unicode_control.py -p bidi -v ${CHANGED_FILES}
      fi

- job:
  timeoutInMinutes: 360
  pool:
    vmImage: $(imageName)

  variables:
    UBUNTU_CODE_NAME: jammy
    USE_CCACHE: 1
    CCACHE_DIR: $(Pipeline.Workspace)/ccache
    CCACHE_COMPRESS: 1
    CCACHE_COMPRESSLEVEL: 9
    CCACHE_CPP2: 1
    CCACHE_MAXSIZE: 4G
    OS_NAME: $(Agent.OS)
    PARENT_BRANCH: 8.4
    BUILD_PARAMS_TYPE: normal

  # Two tiers of coverage:
  #
  #   default   the five configs listed first -- built on every pull request.
  #   extended  the remaining 31, inserted only when the run is not a pull
  #             request (nightly schedule, manual queue) or the pull request's
  #             source branch name contains "fullci", e.g. PS-11473-8.4-fullci.
  #
  # The guard is a compile-time insertion, so excluded legs are never generated:
  # they cost no agent, add no skipped entries, and the ones that do run are all
  # queued when the run starts. A runtime condition cannot do this -- job
  # conditions are evaluated before matrix variables are in scope, and anything
  # depending on another job is only queued once that job finishes, landing at
  # the back of the queue.
  #
  # Build.SourceBranchName is *not* usable here: on a GitHub pull request the
  # ref is refs/pull/<n>/merge, so the branch name is always "merge". The PR's
  # real branch comes from System.PullRequest.SourceBranch; Build.SourceBranch
  # is checked as well so a manual run on a *fullci* branch also matches.
  strategy:
    matrix:

      clang-22 RelWithDebInfo [Ubuntu 24.04 Noble]:
        imageName: 'ubuntu-24.04'
        UBUNTU_CODE_NAME: noble
        Compiler: clang
        CompilerVer: 22
        BuildType: RelWithDebInfo

      clang-22 Debug [Ubuntu 24.04 Noble]:
        imageName: 'ubuntu-24.04'
        UBUNTU_CODE_NAME: noble
        Compiler: clang
        CompilerVer: 22
        BuildType: Debug

      gcc-16 RelWithDebInfo [Ubuntu 24.04 Noble]:
        imageName: 'ubuntu-24.04'
        Compiler: gcc
        CompilerVer: 16
        BuildType: RelWithDebInfo

      gcc-16 Debug [Ubuntu 24.04 Noble]:
        imageName: 'ubuntu-24.04'
        Compiler: gcc
        CompilerVer: 16
        BuildType: Debug

      gcc-16 Debug INVERTED [Ubuntu 24.04 Noble]:
        imageName: 'ubuntu-24.04'
        Compiler: gcc
        CompilerVer: 16
        BuildType: Debug
        BUILD_PARAMS_TYPE: inverted

      ${{ if or(ne(variables['Build.Reason'], 'PullRequest'), contains(variables['System.PullRequest.SourceBranch'], 'fullci'), contains(variables['Build.SourceBranch'], 'fullci')) }}:
        # macOS 14 (only fullci branches)
        macOS 14 RelWithDebInfo:
          imageName: 'macOS-14'
          Compiler: clang
          BuildType: RelWithDebInfo

        macOS 14 Debug:
          imageName: 'macOS-14'
          Compiler: clang
          BuildType: Debug


        # clang-14 and newer compilers (only fullci branches)
        clang-22 RelWithDebInfo INVERTED [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 22
          BuildType: RelWithDebInfo
          BUILD_PARAMS_TYPE: inverted

        clang-21 RelWithDebInfo [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 21
          BuildType: RelWithDebInfo

        clang-21 Debug [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 21
          BuildType: Debug

        clang-20 RelWithDebInfo [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 20
          BuildType: RelWithDebInfo

        clang-20 Debug [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 20
          BuildType: Debug

        clang-19 RelWithDebInfo [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 19
          BuildType: RelWithDebInfo

        clang-19 Debug [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 19
          BuildType: Debug

        clang-18 RelWithDebInfo [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 18
          BuildType: RelWithDebInfo

        clang-18 Debug [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          UBUNTU_CODE_NAME: noble
          Compiler: clang
          CompilerVer: 18
          BuildType: Debug

        clang-17 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 17
          BuildType: RelWithDebInfo

        clang-17 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 17
          BuildType: Debug

        clang-16 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 16
          BuildType: RelWithDebInfo

        clang-16 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 16
          BuildType: Debug

        clang-15 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 15
          BuildType: RelWithDebInfo

        clang-15 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 15
          BuildType: Debug

        clang-14 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 14
          BuildType: RelWithDebInfo

        clang-14 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: clang
          CompilerVer: 14
          BuildType: Debug


        # gcc-10 and newer compilers (only fullci branches)
        gcc-15 RelWithDebInfo [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          Compiler: gcc
          CompilerVer: 15
          BuildType: RelWithDebInfo

        gcc-15 Debug [Ubuntu 24.04 Noble]:
          imageName: 'ubuntu-24.04'
          Compiler: gcc
          CompilerVer: 15
          BuildType: Debug

        gcc-14 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 14
          BuildType: RelWithDebInfo

        gcc-14 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 14
          BuildType: Debug

        gcc-13 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 13
          BuildType: RelWithDebInfo

        gcc-13 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 13
          BuildType: Debug

        gcc-12 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 12
          BuildType: RelWithDebInfo

        gcc-12 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 12
          BuildType: Debug

        gcc-11 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 11
          BuildType: RelWithDebInfo

        gcc-11 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 11
          BuildType: Debug

        gcc-10 RelWithDebInfo [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 10
          BuildType: RelWithDebInfo

        gcc-10 Debug [Ubuntu 22.04 Jammy]:
          imageName: 'ubuntu-22.04'
          Compiler: gcc
          CompilerVer: 10
          BuildType: Debug

  steps:
  - script: |
      # Logic for Ubuntu 22.04 or 24.04
      if [[ "$(imageName)" =~ ubuntu-(22|24).04 ]]; then
        df -Th
        echo "--- Performing Deep Clean for $(imageName) ---"

        echo "1. Remove .NET (~4.0 GB)"
        sudo rm -rf /usr/share/dotnet

        echo "2. Remove Swift (~3.2 GB)"
        sudo rm -rf /usr/share/swift

        echo "3. Remove Tool Cache (CodeQL, Go, Ruby) (~3.0 GB)"
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /opt/hostedtoolcache/Ruby

        echo "4. Remove Julia (~1.0 GB)"
        sudo rm -rf /usr/local/julia*

        echo "5. Remove Android SDK (~9-12 GB)"
        sudo rm -rf /usr/local/lib/android

        echo "6. Clean up Docker images and volumes"
        docker system prune -af --volumes

        echo "--- Disk space after cleanup ---"
        df -Th
      fi
    displayName: 'Clean Disk Space'

  - script: |
      uname -r
      df -Th
      ls -l ..
      pwd
      ls -l

      if [[ "$OS_NAME" == "Linux" ]]; then
        SELECTED_CC=$(Compiler)-$(CompilerVer)
        if [[ "$(Compiler)" == "clang" ]]; then
          SELECTED_CXX=clang++-$(CompilerVer)
          PACKAGES="$SELECTED_CC $PACKAGES"
        else
          SELECTED_CXX=g++-$(CompilerVer)
          PACKAGES="$SELECTED_CXX $PACKAGES"
        fi
      else
        REAL_COMPILER_VER=`$(Compiler) --version | grep -o "clang version.*" | awk '{print $3}'`
        SELECTED_CC=$(Compiler)
        SELECTED_CXX=clang++
      fi

      echo SELECTED_CC=$SELECTED_CC SELECTED_CXX=$SELECTED_CXX BuildType=$(BuildType) BUILD_PARAMS_TYPE=$(BUILD_PARAMS_TYPE) imageName=$(imageName) OS_NAME=$OS_NAME
      echo --- Configure required LLVM and Ubuntu Toolchain repositories
      if [[ "$OS_NAME" == "Linux" ]] && [[ "$SELECTED_CC" == "clang"* ]]; then
        PACKAGES="llvm-$(CompilerVer)-dev $PACKAGES"
        curl -sSL "http://apt.llvm.org/llvm-snapshot.gpg.key" | sudo -E apt-key add -
        echo "deb http://apt.llvm.org/$(UBUNTU_CODE_NAME)/ llvm-toolchain-$(UBUNTU_CODE_NAME)-$(CompilerVer) main" | sudo tee -a /etc/apt/sources.list > /dev/null
      fi

      echo --- Update list of packages and download dependencies
      if [[ "$OS_NAME" == "Linux" ]]; then
        sudo -E apt-add-repository -y "ppa:ubuntu-toolchain-r/test"
        sudo -E apt-get -yq update >> ~/apt-get-update.log 2>&1

        sudo -E apt-get -yq --no-install-suggests --no-install-recommends --allow-unauthenticated install $PACKAGES cmake cmake-curses-gui ccache bison libtirpc-dev libudev-dev libaio-dev libmecab-dev libnuma-dev libssl-dev libedit-dev libpam-dev libcurl4-openssl-dev libldap2-dev libkrb5-dev libsasl2-dev libsasl2-modules-gssapi-mit || exit 1;
        `# SYSTEM_LIBRARIES = CURL EDITLINE ICU LIBEVENT LZ4 PROTOBUF SSL ZSTD FIDO (Ubuntu 21.04+)`
        if [[ "$(BUILD_PARAMS_TYPE)" != "inverted" ]]; then
          sudo -E apt-get -yq --no-install-suggests --no-install-recommends --allow-unauthenticated install libicu-dev libevent-dev liblz4-dev zlib1g-dev protobuf-compiler libprotobuf-dev libprotoc-dev libzstd-dev libfido2-dev || exit 1;
        else
          sudo -E apt-get -yq --no-install-suggests --no-install-recommends --allow-unauthenticated install libgflags-dev || exit 1;
        fi

        if [[ "$(Compiler)" == "clang" ]]; then
          REAL_COMPILER_VER=`$SELECTED_CC --version | grep -o "clang version.*" | awk '{print $3}'`
        else
          REAL_COMPILER_VER=`$SELECTED_CC --version | head -1 | awk '{print $4}'`
        fi
      else
        brew update
        brew install ccache protobuf@21 lz4 openssl@3 bison
        brew link --force protobuf@21
      fi

      UPDATE_TIME=$SECONDS
      echo --- Packages updated in $UPDATE_TIME seconds.

      echo "##vso[task.setvariable variable=REAL_COMPILER_VER]${REAL_COMPILER_VER%%-*}"
      echo "##vso[task.setvariable variable=SELECTED_CC]$SELECTED_CC"
      echo "##vso[task.setvariable variable=SELECTED_CXX]$SELECTED_CXX"
      echo "##vso[task.setvariable variable=UPDATE_TIME]$UPDATE_TIME"

    displayName: '*** Install Build Dependencies'

  - task: Cache@2
    continueOnError: true
    inputs:
      key: '"ccache"| "$(PARENT_BRANCH)" | "$(imageName)-$(Compiler)-$(REAL_COMPILER_VER)-$(BuildType)" | "BUILD_PARAMS_TYPE=$(BUILD_PARAMS_TYPE)" | "$(Build.SourceVersion)"'
      restoreKeys: '"ccache" | "$(PARENT_BRANCH)" | "$(imageName)-$(Compiler)-$(REAL_COMPILER_VER)-$(BuildType)" | "BUILD_PARAMS_TYPE=$(BUILD_PARAMS_TYPE)"'
      path: $(CCACHE_DIR)
    displayName: '*** Download/upload ccached files'

  - checkout: self
    fetchDepth: 32

  - script: |
      df -Th
      git submodule sync
      git submodule update --init --force --depth=256
      git submodule
    displayName: '*** Update git submodules'

  - script: |
      echo "SELECTED_CC=$SELECTED_CC (`which $SELECTED_CC`) SELECTED_CXX=$SELECTED_CXX (`which $SELECTED_CXX`) REAL_COMPILER_VER=$REAL_COMPILER_VER BuildType=$(BuildType)"
      $SELECTED_CC -v
      $SELECTED_CXX -v
      ccache --version
      ccache -p
      ccache --zero-stats
      df -Th
      if [[ "$OS_NAME" == "Linux" ]]; then
        cat /proc/cpuinfo
      fi
    displayName: '*** System and compiler info'

  - script: |
      echo SELECTED_CC=$SELECTED_CC SELECTED_CXX=$SELECTED_CXX REAL_COMPILER_VER=$REAL_COMPILER_VER BuildType=$(BuildType) BUILD_PARAMS_TYPE=$(BUILD_PARAMS_TYPE) imageName=$(imageName) OS_NAME=$OS_NAME
      echo --- Set cmake parameters
      COMPILE_OPT+=(
        -DCMAKE_C_FLAGS_DEBUG=-g1
        -DCMAKE_CXX_FLAGS_DEBUG=-g1
      )

      CMAKE_OPT="
        -DCMAKE_BUILD_TYPE=$(BuildType)
        -DBUILD_CONFIG=mysql_release
        -DWITH_PACKAGE_FLAGS=OFF
        -DCMAKE_C_COMPILER=$SELECTED_CC
        -DCMAKE_CXX_COMPILER=$SELECTED_CXX
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DWITH_ROCKSDB=ON
        -DWITH_COREDUMPER=ON
        -DWITH_COMPONENT_KEYRING_VAULT=ON
        -DWITH_PAM=ON
      "

      if [[ "$OS_NAME" == "Darwin" ]]; then
        OPENSSL_PREFIX=$(brew --prefix openssl@3)
        CMAKE_OPT+="
          -DMYSQL_MAINTAINER_MODE=OFF
          -DWITH_PROTOBUF=system
          -DWITH_SYSTEM_LIBS=ON
          -DWITH_ICU=bundled
          -DWITH_SSL=$OPENSSL_PREFIX
          -DWITH_FIDO=bundled
          -DWITH_ZLIB=bundled
          -DWITH_PERCONA_AUTHENTICATION_LDAP=OFF
        "
      else
        CMAKE_OPT+="
          -DMYSQL_MAINTAINER_MODE=ON
        "
        if [[ "$(BUILD_PARAMS_TYPE)" != "inverted" ]]; then
          CMAKE_OPT+="
            -DWITH_MECAB=system
            -DWITH_NUMA=ON
            -DWITH_SYSTEM_LIBS=ON
            -DWITH_EDITLINE=system
          "
          `# Required liblz4 1.9.3 and installed version is 1.9.2`
          if [[ "$(imageName)" == "ubuntu-20.04" ]]; then
            CMAKE_OPT+="-DWITH_LZ4=bundled"
          fi
        else
          CMAKE_OPT+="
            -DWITH_NDB=ON
            -DWITH_NDBCLUSTER=ON
            -DWITH_NDB_JAVA=OFF

            -DWITH_ROUTER=OFF
            -DWITH_UNIT_TESTS=OFF
            -DWITH_NUMA=OFF

            -DWITH_EDITLINE=bundled
            -DWITH_FIDO=bundled
            -DWITH_ICU=bundled
            -DWITH_LIBEVENT=bundled
            -DWITH_LZ4=bundled
            -DWITH_PROTOBUF=bundled
            -DWITH_RAPIDJSON=bundled
            -DWITH_ZLIB=bundled
            -DWITH_ZSTD=bundled
            -DWITH_CURL=bundled

            -DWITH_ARCHIVE_STORAGE_ENGINE=OFF
            -DWITH_BLACKHOLE_STORAGE_ENGINE=OFF
            -DWITH_EXAMPLE_STORAGE_ENGINE=ON
            -DWITH_FEDERATED_STORAGE_ENGINE=OFF
            -DWITHOUT_PERFSCHEMA_STORAGE_ENGINE=ON
            -DWITH_INNODB_MEMCACHED=ON
          "
        fi
      fi

      echo --- CMAKE_OPT=\"$CMAKE_OPT\"
      echo --- COMPILE_OPT=\"${COMPILE_OPT[@]}\"
      mkdir bin; cd bin
      cmake .. $CMAKE_OPT "${COMPILE_OPT[@]}" || exit 1

      CMAKE_TIME=$SECONDS
      echo --- CMake took $CMAKE_TIME seconds. Packages updated in $UPDATE_TIME seconds.
      cmake -L .

      echo '##vso[task.setvariable variable=CMAKE_TIME]'$CMAKE_TIME

    displayName: '*** cmake -DCMAKE_BUILD_TYPE=$(BuildType)'

  - script: |
      df -Th
      cd bin
      make -j2 || exit 1
      ccache --show-stats

      BUILD_TIME=$SECONDS
      echo --- Total time $(($BUILD_TIME + $UPDATE_TIME + $CMAKE_TIME)) seconds. Build time $BUILD_TIME seconds. CMake took $CMAKE_TIME seconds. Packages updated in $UPDATE_TIME seconds.
      df -Th
      rm -rf *
      df -Th

    displayName: '*** Compile'
